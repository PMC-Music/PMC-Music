<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Mainstream Chaos - Alle Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 20% 50%, #ff1493 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, #ff1493 0%, transparent 50%);
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid #ff1493;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.5);
        }

        h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
        }

        .subtitle {
            color: #ff1493;
            font-size: 1.2em;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-btn {
            display: block;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ff1493;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .link-btn:hover {
            background: #ff1493;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.6);
        }

        .link-btn.spotify {
            border-color: #1DB954;
        }

        .link-btn.spotify:hover {
            background: #1DB954;
            box-shadow: 0 10px 30px rgba(29, 185, 84, 0.6);
        }

        .link-btn.instagram {
            border-color: #E4405F;
        }

        .link-btn.instagram:hover {
            background: #E4405F;
            box-shadow: 0 10px 30px rgba(228, 64, 95, 0.6);
        }

        .link-btn.youtube {
            border-color: #FF0000;
        }

        .link-btn.youtube:hover {
            background: #FF0000;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.6);
        }

        .link-btn.tiktok {
            border-color: #00f2ea;
        }

        .link-btn.tiktok:hover {
            background: #00f2ea;
            color: #000;
            box-shadow: 0 10px 30px rgba(0, 242, 234, 0.6);
        }

        .social-icons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icons a {
            color: #ff1493;
            font-size: 1.5em;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            color: #fff;
            transform: scale(1.2);
        }

        .heart {
            color: #ff1493;
            margin-top: 30px;
            font-size: 2em;
            animation: pulse 1.5s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }
            
            .link-btn {
                padding: 15px 25px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dein Profilbild - ersetze src mit deinem Bild -->
        <img src="dein-profilbild.jpg" alt="Perfect Mainstream Chaos" class="profile-img">
        
        <h1>Perfect Mainstream Chaos</h1>
        <p class="subtitle">🎵 Soulmate - Out Now 🎵</p>
        
        <div class="links">
            <a href="https://open.spotify.com/your-link" class="link-btn spotify" target="_blank">
                🎧 Auf Spotify hören
            </a>
            
            <a href="https://music.apple.com/your-link" class="link-btn" target="_blank">
                🍎 Apple Music
            </a>
            
            <a href="https://youtube.com/your-link" class="link-btn youtube" target="_blank">
                ▶️ YouTube Music
            </a>
            
            <a href="https://instagram.com/your-profile" class="link-btn instagram" target="_blank">
                📸 Instagram
            </a>
            
            <a href="https://tiktok.com/@your-profile" class="link-btn tiktok" target="_blank">
                🎵 TikTok
            </a>
            
            <a href="https://facebook.com/your-page" class="link-btn" target="_blank">
                👥 Facebook
            </a>
            
            <a href="mailto:deine-email@example.com" class="link-btn">
                📧 Kontakt / Booking
            </a>
        </div>
        
        <div class="heart">💗</div>
    </div>
</body>
</html>
